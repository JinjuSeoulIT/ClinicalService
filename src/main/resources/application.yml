spring:
  application:
    name: hospital_clinical
  profiles:
    default: local
  jpa:
    open-in-view: false

reception:
  api:
    base-url: ${RECEPTION_API_BASE_URL:http://192.168.1.55:8283}

clinical-support:
  api:
    base-url: ${CLINICAL_SUPPORT_API_BASE_URL:http://192.168.1.66:8181}
    enabled: ${CLINICAL_SUPPORT_API_ENABLED:true} 

billing:
  api:
    base-url: ${BILLING_API_BASE_URL:http://192.168.1.68:8081}
    enabled: ${BILLING_API_ENABLED:true}

hira:
  api:
    base-url: ${HIRA_API_BASE_URL:http://apis.data.go.kr}
    service-key: ${HIRA_API_KEY:}

drug:
  api:
    base-url: http://apis.data.go.kr
    service-key: "${DRUG_API_KEY}"

disease:
  api:
    base-url: http://apis.data.go.kr
    service-key: "${DISEASE_API_KEY}"

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/**/*.xml

app:
  migration:
    soap-rx-to-order:
      enabled: ${SOAP_RX_TO_ORDER_MIGRATION:false}

---
spring:
  datasource:
    url: jdbc:oracle:thin:@192.168.1.67:1521:xe
    username: ssh
    password: 1111
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8090}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: SSH

server:
  port: ${SERVER_PORT:8090}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: SSH

server:
  port: ${SERVER_PORT:8080}
